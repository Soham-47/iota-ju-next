name: Quality Gate (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript Typecheck
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test

      - name: Build Next.js & Payload Application
        run: pnpm build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/iota_ju_db"
          PAYLOAD_SECRET: "ci-build-secret-key-minimum-32-characters-long"
          SERVER_URL: "http://localhost:3000"
